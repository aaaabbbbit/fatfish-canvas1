# fatfish-canvas 组合包 patch —— 激活行就在这里（bundle 层）。
#
# 2026-10-08 从 profile 层搬回来。原来手写在
#   $DSH_HOME/profiles/web/cordis.patch.yml
# 那一层被 Loader 监听、改动实时重放，换来「往 profile 里加新插件不用重启」。
# 代价是**这个包装到别处等于没装**：`plugin_manager install_bundle <包目录>`
# （以及换机器、换 profile）只做「装包 + 选 bundle」，行来自**包内这个 patch**
# （依据 dsh-agent-preset 的 host-plugin 参考：A bundle is a package whose
# package.json declares `dsh.bundle.patch`; the YAML patch inserts plugin
# entries）。空 patch = 没有任何行被插入，画布不会出现，而且要等到有人手写
# profile 行才发现。
#
# ⚠️ profile 层**不要**再插一遍：applyEntryPatches 的 insert 不去重
#   （`data.push(...insert)`），两处同时插入 = 本插件被加载两次 ——
#   P2 注册 settings namespace 时会直接以「重复 namespace」报错（NOTES §8.3），
#   且两行各持一份 Config，设置写入只会落到其中一行，另一行永远读到默认值。
#
# 代价：bundle 层在**启动时**组合、不参与实时重放 → 改本文件（或新增行）要重启
#   `dsh web` 才生效。改客户端代码不受影响，照旧 `node build.mjs` + 刷新页面。
- insert:
    - id: fatfish-canvas
      name: fatfish-canvas
